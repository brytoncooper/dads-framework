name: Prepare npm release artifacts

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Release track to prepare: all (24 packages) or testing (6 testing packages)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - testing

permissions:
  contents: read

concurrency:
  group: npm-release-artifacts-${{ inputs.scope || 'all' }}
  cancel-in-progress: false

jobs:
  native:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    uses: ./.github/workflows/testing-native-release.yml

  verify-source:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        env:
          RELEASE_SCOPE: ${{ inputs.scope || 'all' }}
          DADS_VERIFY_JOBS: 2
          VITEST_MAX_WORKERS: 2
          DADS_VERIFY_TEST_PROGRESS: 1
        run: |
          if [[ "$RELEASE_SCOPE" == "testing" ]]; then
            node scripts/release/verify-testing-source.mjs
          else
            node scripts/release/sync-package-licenses.mjs
            npm run verify -- --no-cache --require-receipt
          fi

  collect:
    needs: [native, verify-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: ${{ (inputs.scope || 'all') == 'testing' && '' || 'npm' }}
      - name: Install gitleaks
        run: |
          set -euo pipefail
          gitleaks_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$gitleaks_dir"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" -o "$gitleaks_dir/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $gitleaks_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$gitleaks_dir/gitleaks.tar.gz" -C "$gitleaks_dir"
          chmod +x "$gitleaks_dir/gitleaks"
          "$gitleaks_dir/gitleaks" version
          echo "$gitleaks_dir" >> "$GITHUB_PATH"
      - name: Install dependencies
        if: (inputs.scope || 'all') != 'testing'
        run: npm ci
      - uses: actions/download-artifact@v4
        if: (inputs.scope || 'all') == 'testing'
        with:
          name: dads-testing-facade-${{ github.run_attempt }}
          path: ${{ runner.temp }}/facade-release
      - uses: actions/download-artifact@v4
        with:
          pattern: dads-testing-native-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-release
      - name: Assemble and prove release archives
        env:
          RELEASE_SCOPE: ${{ inputs.scope || 'all' }}
          RELEASE_DIR: ${{ runner.temp }}/npm-release
          NATIVE_DIR: ${{ runner.temp }}/native-release
          FACADE_DIR: ${{ runner.temp }}/facade-release
          DADS_ADOPTION_JOBS: 4
        run: |
          set -euo pipefail
          node scripts/release/sync-package-licenses.mjs
          if [[ "$RELEASE_SCOPE" == "testing" ]]; then
            facade_version=$(node -p 'require("./packages/testing/core/package.json").version')
            facade_tar="$FACADE_DIR/dads-framework-testing-$facade_version.tgz"
            test -f "$facade_tar"
            facade_extract="$RUNNER_TEMP/facade-extract"
            mkdir -p "$facade_extract"
            tar -xzf "$facade_tar" -C "$facade_extract"
            test -d "$facade_extract/package/dist"
            rm -rf packages/testing/core/dist
            cp -R "$facade_extract/package/dist" packages/testing/core/dist
          else
            npm run build
          fi
          mkdir "$RELEASE_DIR"
          node scripts/release/collect-native-release.mjs "$NATIVE_DIR" "$RELEASE_DIR"
          node scripts/release/pack-preflight.mjs --scope "$RELEASE_SCOPE" --output "$RELEASE_DIR"
          if [[ "$RELEASE_SCOPE" == "testing" ]]; then
            node scripts/testing/verify-testing-package.mjs --packed-directory "$RELEASE_DIR"
          else
            node scripts/adoption/verify-adoption.mjs --packed-directory "$RELEASE_DIR"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dads-npm-verified-${{ inputs.scope || 'all' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  sign:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: actions/download-artifact@v4
        with:
          name: dads-npm-verified-${{ inputs.scope || 'all' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release
      - name: Sign exact release archives
        env:
          RELEASE_SCOPE: ${{ inputs.scope || 'all' }}
          RELEASE_DIR: ${{ runner.temp }}/npm-release
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-signing" --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund --save-exact npm@11.21.2
          node scripts/release/sign-release.mjs sign "$RELEASE_DIR" "$RUNNER_TEMP/npm-signing/node_modules/npm" --scope "$RELEASE_SCOPE"
      - uses: actions/upload-artifact@v4
        with:
          name: dads-npm-release-${{ inputs.scope || 'all' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
