name: Prepare npm release artifacts

on:
  workflow_dispatch:
    inputs:
      use_self_hosted_mac:
        description: Build macOS native binaries on self-hosted dads-release-mac runner
        type: boolean
        default: false
      use_self_hosted_linux:
        description: Run verify-source, collect, and linux-x64 native build on self-hosted dads-release-linux runner
        type: boolean
        default: false
      use_self_hosted_win:
        description: Build win32-x64 native binary on self-hosted dads-release-win runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release-artifacts
  cancel-in-progress: false

jobs:
  native:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    uses: ./.github/workflows/testing-native-release.yml
    with:
      use_self_hosted_mac: ${{ inputs.use_self_hosted_mac }}
      use_self_hosted_linux: ${{ inputs.use_self_hosted_linux }}
      use_self_hosted_win: ${{ inputs.use_self_hosted_win }}

  verify-source:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    environment: release
    runs-on: ${{ fromJSON(inputs.use_self_hosted_linux && '["self-hosted","dads-release-linux"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        env:
          DADS_VERIFY_JOBS: ${{ inputs.use_self_hosted_linux && '12' || '2' }}
          VITEST_MAX_WORKERS: ${{ inputs.use_self_hosted_linux && '12' || '2' }}
          DADS_VERIFY_TEST_PROGRESS: 1
        run: |
          node scripts/release/sync-package-licenses.mjs
          npm run verify -- --no-cache --require-receipt

  collect:
    needs: [native, verify-source]
    environment: release
    runs-on: ${{ fromJSON(inputs.use_self_hosted_linux && '["self-hosted","dads-release-linux"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: Install proof tools
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          go env GOPATH | sed 's|$|/bin|' >> "$GITHUB_PATH"
          npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: dads-testing-native-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-release
      - name: Assemble and prove release archives
        env:
          RELEASE_DIR: ${{ runner.temp }}/npm-release
          NATIVE_DIR: ${{ runner.temp }}/native-release
          DADS_ADOPTION_JOBS: ${{ inputs.use_self_hosted_linux && '8' || '4' }}
        run: |
          node scripts/release/sync-package-licenses.mjs
          npm run build
          mkdir "$RELEASE_DIR"
          node scripts/release/collect-native-release.mjs "$NATIVE_DIR" "$RELEASE_DIR"
          node scripts/release/pack-preflight.mjs --output "$RELEASE_DIR"
          node scripts/adoption/verify-adoption.mjs --packed-directory "$RELEASE_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: dads-npm-verified-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  sign:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: actions/download-artifact@v4
        with:
          name: dads-npm-verified-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release
      - name: Sign exact release archives
        env:
          RELEASE_DIR: ${{ runner.temp }}/npm-release
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-signing" --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund --save-exact npm@11.21.2
          node scripts/release/sign-release.mjs sign "$RELEASE_DIR" "$RUNNER_TEMP/npm-signing/node_modules/npm"
      - uses: actions/upload-artifact@v4
        with:
          name: dads-npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
