<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="same-origin" />
    <title>Examples · Dads Workbench</title>
    <link rel="stylesheet" href="/apps/web/examples.css" />
  </head>
  <body>
    <header class="examples-header" id="top">
      <div class="examples-frame">
        <a class="examples-brand" href="./">Dads Workbench</a>
        <nav aria-label="Workbench links">
          <a href="./" class="back-link">Back to workbench <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main class="examples-frame">
      <div class="examples-intro">
        <h1>Workbench examples</h1>
        <p>Set up a local workspace and use it to try six features in the Dads starter app.</p>
      </div>
      <div class="examples-layout">
        <aside class="examples-sidebar">
          <nav aria-label="Example guides">
            <ul>
              <template id="guide-link">
                <li><a href="#{{id}}">{{label}}</a></li>
              </template>
            </ul>
          </nav>
          <a class="examples-top" href="#top">Back to top ↑</a>
        </aside>
        <div class="examples-articles">
          <template id="guide-article">
            <article class="example-guide" id="{{id}}" tabindex="-1">{{body}}</article>
          </template>
        </div>
      </div>
    </main>
  </body>
</html>
