services:
  postgres:
    image: postgres:16-alpine
    container_name: ${DADS_WORKBENCH_PROJECT:?}-postgres
    labels:
      dev.dads.workbench: ${DADS_WORKBENCH_PROJECT:?}
    environment:
      POSTGRES_USER: dads
      POSTGRES_DB: dads
      POSTGRES_PASSWORD: ${DADS_WORKBENCH_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    networks: [workbench]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, dads, -d, dads]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: "no"

  migrate:
    profiles: [spicedb]
    image: authzed/spicedb:v1.56.1
    container_name: ${DADS_WORKBENCH_PROJECT:?}-migrate
    labels:
      dev.dads.workbench: ${DADS_WORKBENCH_PROJECT:?}
    command: [datastore, migrate, head, --datastore-engine, postgres, --migration-timeout, 45s, --log-level, warn]
    environment:
      SPICEDB_DATASTORE_CONN_URI: ${DADS_WORKBENCH_DATASTORE_URI:?}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [workbench]
    restart: "no"

  spicedb:
    profiles: [spicedb]
    image: authzed/spicedb:v1.56.1
    container_name: ${DADS_WORKBENCH_PROJECT:?}-spicedb
    labels:
      dev.dads.workbench: ${DADS_WORKBENCH_PROJECT:?}
    command: [serve, --datastore-engine, postgres, --log-level, warn]
    environment:
      SPICEDB_DATASTORE_CONN_URI: ${DADS_WORKBENCH_DATASTORE_URI:?}
      SPICEDB_GRPC_PRESHARED_KEY: ${DADS_WORKBENCH_TOKEN:?}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1::50051"
    networks: [workbench]
    healthcheck:
      test: [CMD, /usr/local/bin/grpc_health_probe, -addr=127.0.0.1:50051, -connect-timeout=1s, -rpc-timeout=1s]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: "no"

volumes:
  postgres_data:
    name: ${DADS_WORKBENCH_PROJECT:?}-postgres-data
    labels:
      dev.dads.workbench: ${DADS_WORKBENCH_PROJECT:?}

networks:
  workbench:
    name: ${DADS_WORKBENCH_PROJECT:?}-network
    labels:
      dev.dads.workbench: ${DADS_WORKBENCH_PROJECT:?}
