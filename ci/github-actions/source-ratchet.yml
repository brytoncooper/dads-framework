name: Source ratchet

on:
  pull_request:

permissions:
  contents: read

jobs:
  source-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx --no-install dad doctor --gate --base "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
