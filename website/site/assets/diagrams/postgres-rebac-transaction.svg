<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 508" width="840" height="508" role="img" aria-labelledby="postgres-rebac-title postgres-rebac-desc">
  <title id="postgres-rebac-title">Atomic PostgreSQL ReBAC Transaction vs Async Outbox</title>
  <desc id="postgres-rebac-desc">Comparison of a single PostgreSQL SERIALIZABLE transaction via withProtectedPostgresTransaction containing 1. Re-check permission tuple returning 404 if revoked, 2. Write domain row, and 3. Commit or rollback atomically returning 409 retryable on serialization conflict with zero lag, contrasted against an external graph store that requires a durable async outbox.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#8ee3c5" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#ffc78d" />
    </marker>
  </defs>

  <style>
    .title { font: 600 16px/1.2 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #edf1f2; }
    .panel-title { font: 600 15px/1.2 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #edf1f2; }
    .subtitle { font: 400 11.5px/1.2 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #afb9bf; }
    .card-title { font: 600 13px/1.2 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #edf1f2; }
    .card-body { font: 400 11.5px/1.35 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #afb9bf; }
    .card-body-hi { font: 400 11.5px/1.35 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #cdd5d9; }
    .step-num { font: 600 11px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #8ee3c5; }
    .eyebrow-mint { font: 600 10px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #8ee3c5; letter-spacing: 0.05em; }
    .eyebrow-muted { font: 600 10px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #afb9bf; letter-spacing: 0.05em; }
    .code-pill { font: 500 11px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #8ee3c5; }
    .pill-coral { font: 500 10.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #f5a6ae; }
    .pill-amber { font: 500 10.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #ffc78d; }
    .caption-amber { font: 500 10.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #ffc78d; }
    .summary-text { font: 500 11px/1.3 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #cdd5d9; }
    .note-title { font: 600 12px/1.2 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #8ee3c5; }
    .note-body { font: 400 11px/1.4 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #cdd5d9; }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="840" height="508" rx="14" fill="#0e1114" />

  <!-- Header -->
  <text x="24" y="38" class="title">Atomic PostgreSQL ReBAC Writes</text>
  <text x="816" y="38" text-anchor="end" class="subtitle">@dads-framework/postgres-access · zero sync lag</text>

  <!-- LEFT PANEL: Single PostgreSQL SERIALIZABLE Transaction -->
  <rect x="20" y="56" width="504" height="432" rx="12" fill="#12171b" stroke="#4b7d6c" stroke-width="1.5" />

  <rect x="38" y="72" width="168" height="20" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="122" y="86" text-anchor="middle" class="eyebrow-mint">POSTGRES MODE · ZERO LAG</text>

  <text x="38" y="114" class="panel-title">Single SERIALIZABLE Transaction</text>

  <rect x="38" y="124" width="248" height="22" rx="5" fill="#171d21" stroke="#333c42" stroke-width="1" />
  <text x="162" y="139" text-anchor="middle" class="code-pill">withProtectedPostgresTransaction</text>

  <!-- Inner Transaction Boundary -->
  <rect x="38" y="158" width="468" height="252" rx="10" fill="#0e1114" stroke="#4b7d6c" stroke-width="1.25" stroke-dasharray="5 4" />
  <text x="54" y="177" class="eyebrow-mint">BEGIN ISOLATION LEVEL SERIALIZABLE · { tx, authorization }</text>

  <!-- Step 1 -->
  <rect x="54" y="188" width="436" height="58" rx="8" fill="#171d21" stroke="#333c42" stroke-width="1" />
  <rect x="68" y="201" width="28" height="20" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="82" y="215" text-anchor="middle" class="step-num">01</text>
  <text x="106" y="213" class="card-title">Re-check permission tuple</text>
  <text x="106" y="232" class="card-body">authorization.check() on live snapshot</text>
  <rect x="364" y="205" width="112" height="22" rx="4" fill="#2a191c" stroke="#7a3e46" stroke-width="1" />
  <text x="420" y="220" text-anchor="middle" class="pill-coral">404 if revoked</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="272" y1="246" x2="272" y2="262" stroke="#8ee3c5" stroke-width="1.75" marker-end="url(#arrow-mint)" />

  <!-- Step 2 -->
  <rect x="54" y="264" width="436" height="58" rx="8" fill="#171d21" stroke="#333c42" stroke-width="1" />
  <rect x="68" y="277" width="28" height="20" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="82" y="291" text-anchor="middle" class="step-num">02</text>
  <text x="106" y="289" class="card-title">Write domain row</text>
  <text x="106" y="308" class="card-body">Insert or update app rows + relation tuples on same tx</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="272" y1="322" x2="272" y2="338" stroke="#8ee3c5" stroke-width="1.75" marker-end="url(#arrow-mint)" />

  <!-- Step 3 -->
  <rect x="54" y="340" width="436" height="58" rx="8" fill="#1c3430" stroke="#4b7d6c" stroke-width="1.5" />
  <rect x="68" y="353" width="28" height="20" rx="5" fill="#0e1114" stroke="#8ee3c5" stroke-width="1" />
  <text x="82" y="367" text-anchor="middle" class="step-num">03</text>
  <text x="106" y="365" class="card-title">Commit or rollback atomically</text>
  <text x="106" y="384" class="card-body-hi">Domain data and tuples land together</text>
  <rect x="370" y="357" width="106" height="22" rx="4" fill="#2a2216" stroke="#7a5e32" stroke-width="1" />
  <text x="423" y="372" text-anchor="middle" class="pill-amber">409 retryable</text>

  <!-- Bottom guarantees inside Left Panel -->
  <rect x="38" y="422" width="468" height="50" rx="8" fill="#171d21" stroke="#232b30" stroke-width="1" />
  <circle cx="56" cy="440" r="4" fill="#f5a6ae" />
  <text x="68" y="444" class="summary-text">Concurrent revoke before snapshot returns 404 and aborts write.</text>
  <circle cx="56" cy="458" r="4" fill="#ffc78d" />
  <text x="68" y="462" class="summary-text">Serialization conflict maps to retryable HTTP 409 conflict.</text>

  <!-- RIGHT PANEL: Contrast - Why no async outbox is needed -->
  <rect x="544" y="56" width="276" height="432" rx="12" fill="#12171b" stroke="#333c42" stroke-width="1" />

  <rect x="562" y="72" width="152" height="20" rx="5" fill="#1c2429" stroke="#333c42" stroke-width="1" />
  <text x="638" y="86" text-anchor="middle" class="eyebrow-muted">WHY NO ASYNC OUTBOX?</text>

  <text x="562" y="114" class="panel-title">Separate Graph Store</text>
  <text x="562" y="134" class="card-body">Two datastores need async relay:</text>

  <!-- External Box 1 -->
  <rect x="562" y="158" width="240" height="54" rx="8" fill="#171d21" stroke="#333c42" stroke-width="1" />
  <text x="576" y="180" class="card-title">1. App Database</text>
  <text x="576" y="198" class="card-body">Write domain row + outbox row</text>

  <!-- Dashed amber arrow 1 -->
  <line x1="682" y1="212" x2="682" y2="240" stroke="#ffc78d" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-amber)" />
  <text x="692" y="230" class="caption-amber">async lag</text>

  <!-- External Box 2 -->
  <rect x="562" y="244" width="240" height="54" rx="8" fill="#171d21" stroke="#7a5e32" stroke-width="1.25" stroke-dasharray="4 3" />
  <text x="576" y="266" class="card-title">2. Durable Outbox Worker</text>
  <text x="576" y="284" class="pill-amber">Poll, retry, project tuples</text>

  <!-- Dashed amber arrow 2 -->
  <line x1="682" y1="298" x2="682" y2="326" stroke="#ffc78d" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-amber)" />
  <text x="692" y="316" class="caption-amber">network hop</text>

  <!-- External Box 3 -->
  <rect x="562" y="330" width="240" height="54" rx="8" fill="#171d21" stroke="#333c42" stroke-width="1" />
  <text x="576" y="352" class="card-title">3. External Auth Graph</text>
  <text x="576" y="370" class="card-body">Tuples update after DB commit</text>

  <!-- Bottom Mint Takeaway -->
  <rect x="562" y="398" width="240" height="74" rx="8" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="576" y="418" class="note-title">Postgres mode removes this</text>
  <text x="576" y="436" class="note-body">Tuples live beside app tables,</text>
  <text x="576" y="451" class="note-body">so one commit replaces the</text>
  <text x="576" y="466" class="note-body">outbox and prevents drift.</text>
</svg>
