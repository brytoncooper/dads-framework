<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 488" width="920" height="488" role="img" aria-labelledby="postgres-rebac-title postgres-rebac-desc">
  <title id="postgres-rebac-title">Dads Single-Transaction Permissions vs Separate Auth Service</title>
  <desc id="postgres-rebac-desc">Comparison showing Dads checking permissions, saving app changes, and committing atomically in one database transaction with zero sync lag, contrasted with a separate auth service requiring a background worker and network hop.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#8ee3c5" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#ffc78d" />
    </marker>
  </defs>

  <style>
    .title { font: 650 20px/1.2 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #f3f7f9; }
    .subtitle { font: 500 13px/1.2 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #b8c6ce; }
    .panel-title { font: 650 18px/1.2 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #f3f7f9; }
    .eyebrow-mint { font: 600 11.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #8ee3c5; letter-spacing: 0.05em; }
    .eyebrow-muted { font: 600 11.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #b8c6ce; letter-spacing: 0.05em; }
    .step-num { font: 600 13px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #8ee3c5; }
    .card-title { font: 650 15.5px/1.2 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #f3f7f9; }
    .card-body { font: 430 13.5px/1.35 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #c1ced6; }
    .card-body-hi { font: 450 13.5px/1.35 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #e3f2ec; }
    .pill-coral { font: 600 12px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #ffb3bc; }
    .pill-amber { font: 600 12px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #ffd09b; }
    .caption-amber { font: 600 12.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #ffd09b; }
    .footer-note { font: 500 13px/1.3 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #b8c6ce; }
    .footer-code { font: 500 12.5px/1.3 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #8ee3c5; }
    .takeaway { font: 650 14px/1.2 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #8ee3c5; }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="920" height="488" rx="14" fill="#0e1114" stroke="#2a343b" stroke-width="1" />

  <!-- Header -->
  <text x="24" y="40" class="title">How Dads Prevents Stale Permission Bugs</text>
  <text x="896" y="40" text-anchor="end" class="subtitle">Same database · Zero sync lag</text>

  <!-- LEFT PANEL: Dads Single Transaction -->
  <rect x="20" y="60" width="528" height="408" rx="12" fill="#12171b" stroke="#4b7d6c" stroke-width="1.5" />

  <rect x="42" y="78" width="212" height="24" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="148" y="94" text-anchor="middle" class="eyebrow-mint">DADS · ONE TRANSACTION</text>

  <text x="42" y="128" class="panel-title">Check and write together</text>

  <!-- Step 1 -->
  <rect x="42" y="146" width="484" height="72" rx="9" fill="#171d21" stroke="#364148" stroke-width="1" />
  <rect x="58" y="166" width="32" height="24" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="74" y="183" text-anchor="middle" class="step-num">01</text>
  <text x="104" y="177" class="card-title">Check permission</text>
  <text x="104" y="200" class="card-body">Reads live tables &amp; relationships</text>
  <rect x="358" y="169" width="152" height="26" rx="5" fill="#2d1a1e" stroke="#8a444e" stroke-width="1" />
  <text x="434" y="186" text-anchor="middle" class="pill-coral">Blocked if revoked</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="284" y1="218" x2="284" y2="242" stroke="#8ee3c5" stroke-width="2" marker-end="url(#arrow-mint)" />

  <!-- Step 2 -->
  <rect x="42" y="246" width="484" height="72" rx="9" fill="#171d21" stroke="#364148" stroke-width="1" />
  <rect x="58" y="266" width="32" height="24" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="74" y="283" text-anchor="middle" class="step-num">02</text>
  <text x="104" y="277" class="card-title">Save your app changes</text>
  <text x="104" y="300" class="card-body">Updates rows and roles on the same connection</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="284" y1="318" x2="284" y2="342" stroke="#8ee3c5" stroke-width="2" marker-end="url(#arrow-mint)" />

  <!-- Step 3 -->
  <rect x="42" y="346" width="484" height="72" rx="9" fill="#19302c" stroke="#4b7d6c" stroke-width="1.5" />
  <rect x="58" y="366" width="32" height="24" rx="5" fill="#0e1114" stroke="#8ee3c5" stroke-width="1" />
  <text x="74" y="383" text-anchor="middle" class="step-num">03</text>
  <text x="104" y="377" class="card-title">Commit atomically</text>
  <text x="104" y="400" class="card-body-hi">App data and permissions stay in sync</text>
  <rect x="366" y="369" width="144" height="26" rx="5" fill="#2d2417" stroke="#8a6a38" stroke-width="1" />
  <text x="438" y="386" text-anchor="middle" class="pill-amber">Retries conflicts</text>

  <!-- Bottom note inside Left Panel -->
  <text x="42" y="447" class="footer-note">Runs inside <tspan class="footer-code">withProtectedPgTransaction</tspan> — revokes apply immediately.</text>

  <!-- RIGHT PANEL: Separate Auth Service -->
  <rect x="568" y="60" width="332" height="408" rx="12" fill="#12171b" stroke="#364148" stroke-width="1" />

  <rect x="590" y="78" width="206" height="24" rx="5" fill="#1c2429" stroke="#364148" stroke-width="1" />
  <text x="693" y="94" text-anchor="middle" class="eyebrow-muted">SEPARATE AUTH SERVICE</text>

  <text x="590" y="128" class="panel-title">Two systems to sync</text>

  <!-- External Box 1 -->
  <rect x="590" y="146" width="288" height="62" rx="9" fill="#171d21" stroke="#364148" stroke-width="1" />
  <text x="608" y="172" class="card-title">1. Your Database</text>
  <text x="608" y="194" class="card-body">Save row + queue sync event</text>

  <!-- Dashed amber arrow 1 -->
  <line x1="734" y1="208" x2="734" y2="236" stroke="#ffc78d" stroke-width="1.75" stroke-dasharray="4 3" marker-end="url(#arrow-amber)" />
  <text x="748" y="227" class="caption-amber">sync lag</text>

  <!-- External Box 2 -->
  <rect x="590" y="240" width="288" height="62" rx="9" fill="#171d21" stroke="#8a6a38" stroke-width="1.25" stroke-dasharray="5 3" />
  <text x="608" y="266" class="card-title">2. Background Worker</text>
  <text x="608" y="288" class="pill-amber">Poll queue, retry failures</text>

  <!-- Dashed amber arrow 2 -->
  <line x1="734" y1="302" x2="734" y2="330" stroke="#ffc78d" stroke-width="1.75" stroke-dasharray="4 3" marker-end="url(#arrow-amber)" />
  <text x="748" y="321" class="caption-amber">network hop</text>

  <!-- External Box 3 -->
  <rect x="590" y="334" width="288" height="62" rx="9" fill="#171d21" stroke="#364148" stroke-width="1" />
  <text x="608" y="360" class="card-title">3. External Auth Server</text>
  <text x="608" y="382" class="card-body">Permissions catch up later</text>

  <!-- Bottom Mint Takeaway -->
  <rect x="590" y="408" width="288" height="46" rx="9" fill="#19302c" stroke="#4b7d6c" stroke-width="1" />
  <text x="734" y="436" text-anchor="middle" class="takeaway">Dads removes the sync layer.</text>
</svg>
