<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 508" width="840" height="508" role="img" aria-labelledby="request-lifecycle-title request-lifecycle-desc">
  <title id="request-lifecycle-title">Dads HTTP Request Lifecycle Pipeline</title>
  <desc id="request-lifecycle-desc">Five-step Dads HTTP request pipeline: Incoming Request flows through 1. Access returning 401 or 404, 2. Policies and Rate Limit returning 429, 3. Zod Input Validation returning 400, 4. Handler and Deadline returning 503, and 5. Response Envelope returning data. OpenAPI and typed web clients derive from the same route contract.</desc>
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#8ee3c5" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4b7d6c" />
    </marker>
  </defs>

  <style>
    .title { font: 600 16px/1.2 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #edf1f2; }
    .subtitle { font: 400 11.5px/1.2 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #afb9bf; }
    .card-title { font: 600 13.5px/1.2 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #edf1f2; }
    .card-body { font: 400 11.5px/1.35 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #afb9bf; }
    .card-body-hi { font: 400 11.5px/1.35 "Instrument Sans", system-ui, -apple-system, sans-serif; fill: #cdd5d9; }
    .step-num { font: 600 11px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #8ee3c5; }
    .eyebrow { font: 600 10px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #8ee3c5; letter-spacing: 0.05em; }
    .pill-coral { font: 500 10.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #f5a6ae; }
    .pill-amber { font: 500 10.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #ffc78d; }
    .pill-mint { font: 500 10.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #8ee3c5; }
    .pill-blue { font: 500 10.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #9ecffa; }
    .caption { font: 500 10.5px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; fill: #a6b2b8; }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="840" height="508" rx="14" fill="#0e1114" />

  <!-- Header -->
  <text x="24" y="38" class="title">Dads HTTP Request Lifecycle</text>
  <text x="816" y="38" text-anchor="end" class="subtitle">@dads-framework/http · fixed pipeline order</text>

  <!-- Main pipeline container -->
  <rect x="20" y="56" width="800" height="314" rx="12" fill="#12171b" stroke="#232b30" stroke-width="1" />

  <!-- ROW 1: Incoming Request -> Step 1 -> Step 2 -->

  <!-- Node 0: Incoming Request -->
  <rect x="40" y="78" width="236" height="106" rx="10" fill="#171d21" stroke="#333c42" stroke-width="1" />
  <rect x="56" y="92" width="96" height="20" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="104" y="106" text-anchor="middle" class="eyebrow">ENTRY POINT</text>
  <text x="56" y="132" class="card-title">Incoming Request</text>
  <text x="56" y="152" class="card-body">Method, URL params, query,</text>
  <text x="56" y="168" class="card-body">headers, session, JSON body</text>

  <!-- Arrow 0 -> 1 -->
  <line x1="276" y1="131" x2="298" y2="131" stroke="#8ee3c5" stroke-width="1.75" marker-end="url(#arrow-mint)" />

  <!-- Step 1: Access -->
  <rect x="302" y="78" width="236" height="106" rx="10" fill="#171d21" stroke="#4b7d6c" stroke-width="1.5" />
  <rect x="318" y="92" width="28" height="20" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="332" y="106" text-anchor="middle" class="step-num">01</text>
  <text x="354" y="107" class="card-title">Access</text>
  <text x="318" y="130" class="card-body-hi">Resolve session &amp; check access</text>
  <text x="318" y="146" class="card-body-hi">rule fail-closed before input</text>
  <rect x="318" y="156" width="84" height="20" rx="4" fill="#2a191c" stroke="#7a3e46" stroke-width="1" />
  <text x="360" y="170" text-anchor="middle" class="pill-coral">401 anon</text>
  <rect x="410" y="156" width="96" height="20" rx="4" fill="#2a191c" stroke="#7a3e46" stroke-width="1" />
  <text x="458" y="170" text-anchor="middle" class="pill-coral">404 denied</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="538" y1="131" x2="560" y2="131" stroke="#8ee3c5" stroke-width="1.75" marker-end="url(#arrow-mint)" />

  <!-- Step 2: Policies & Rate Limit -->
  <rect x="564" y="78" width="236" height="106" rx="10" fill="#171d21" stroke="#333c42" stroke-width="1" />
  <rect x="580" y="92" width="28" height="20" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="594" y="106" text-anchor="middle" class="step-num">02</text>
  <text x="616" y="107" class="card-title">Policies &amp; Rate Limit</text>
  <text x="580" y="130" class="card-body">Attach audit actor, feature flags,</text>
  <text x="580" y="146" class="card-body">per-caller rateLimit check</text>
  <rect x="580" y="156" width="132" height="20" rx="4" fill="#2a2216" stroke="#7a5e32" stroke-width="1" />
  <text x="646" y="170" text-anchor="middle" class="pill-amber">429 retry-after</text>

  <!-- Row 1 -> Row 2 clean stepped connector -->
  <path d="M 682 184 L 682 204 Q 682 214 672 214 L 168 214 Q 158 214 158 224 L 158 238" fill="none" stroke="#8ee3c5" stroke-width="1.75" marker-end="url(#arrow-mint)" />

  <!-- ROW 2: Step 3 -> Step 4 -> Step 5 -->

  <!-- Step 3: Zod Input Validation -->
  <rect x="40" y="242" width="236" height="106" rx="10" fill="#171d21" stroke="#333c42" stroke-width="1" />
  <rect x="56" y="256" width="28" height="20" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="70" y="270" text-anchor="middle" class="step-num">03</text>
  <text x="92" y="271" class="card-title">Zod Input Validation</text>
  <text x="56" y="294" class="card-body">Parse params, query, and body</text>
  <text x="56" y="310" class="card-body">against declared Zod schemas</text>
  <rect x="56" y="320" width="136" height="20" rx="4" fill="#2a2216" stroke="#7a5e32" stroke-width="1" />
  <text x="124" y="334" text-anchor="middle" class="pill-amber">400 field issues</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="276" y1="295" x2="298" y2="295" stroke="#8ee3c5" stroke-width="1.75" marker-end="url(#arrow-mint)" />

  <!-- Step 4: Handler + Deadline -->
  <rect x="302" y="242" width="236" height="106" rx="10" fill="#171d21" stroke="#333c42" stroke-width="1" />
  <rect x="318" y="256" width="28" height="20" rx="5" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="332" y="270" text-anchor="middle" class="step-num">04</text>
  <text x="354" y="271" class="card-title">Handler + Deadline</text>
  <text x="318" y="294" class="card-body">Execute sync or async handler</text>
  <text x="318" y="310" class="card-body">under hard handlerTimeoutMs</text>
  <rect x="318" y="320" width="164" height="20" rx="4" fill="#2a2216" stroke="#7a5e32" stroke-width="1" />
  <text x="400" y="334" text-anchor="middle" class="pill-amber">503 HANDLER_TIMEOUT</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="538" y1="295" x2="560" y2="295" stroke="#8ee3c5" stroke-width="1.75" marker-end="url(#arrow-mint)" />

  <!-- Step 5: Response Envelope -->
  <rect x="564" y="242" width="236" height="106" rx="10" fill="#1c3430" stroke="#4b7d6c" stroke-width="1.5" />
  <rect x="580" y="256" width="28" height="20" rx="5" fill="#0e1114" stroke="#8ee3c5" stroke-width="1" />
  <text x="594" y="270" text-anchor="middle" class="step-num">05</text>
  <text x="616" y="271" class="card-title">Response Envelope</text>
  <text x="580" y="294" class="card-body-hi">Validate output schema; drift</text>
  <text x="580" y="310" class="card-body-hi">returns masked 500 error</text>
  <rect x="580" y="320" width="76" height="20" rx="4" fill="#0e1114" stroke="#4b7d6c" stroke-width="1" />
  <text x="618" y="334" text-anchor="middle" class="pill-mint">{ data }</text>
  <rect x="664" y="320" width="114" height="20" rx="4" fill="#0e1114" stroke="#4b7d6c" stroke-width="1" />
  <text x="721" y="334" text-anchor="middle" class="pill-mint">{ data, meta }</text>

  <!-- Contract derivation dashed connectors from Step 3 & Step 5 down to Callout -->
  <line x1="158" y1="348" x2="158" y2="394" stroke="#4b7d6c" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-muted)" />
  <line x1="682" y1="348" x2="682" y2="394" stroke="#4b7d6c" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-muted)" />
  <text x="420" y="388" text-anchor="middle" class="caption">same route schemas feed build-time artifacts</text>

  <!-- Bottom Contract Callout -->
  <rect x="20" y="398" width="800" height="90" rx="12" fill="#171d21" stroke="#333c42" stroke-width="1" />
  <rect x="20" y="398" width="5" height="90" rx="2" fill="#8ee3c5" />

  <text x="44" y="422" class="eyebrow">SHARED ROUTE CONTRACT</text>
  <text x="44" y="446" class="title">OpenAPI + Typed Client</text>
  <text x="44" y="468" class="card-body">buildOpenApiDocument and browser clients derive from the same Zod route definitions.</text>

  <!-- Artifact badges on right -->
  <rect x="616" y="414" width="184" height="26" rx="6" fill="#17232e" stroke="#3e5f7a" stroke-width="1" />
  <text x="708" y="431" text-anchor="middle" class="pill-blue">OpenAPI 3.1 Document</text>

  <rect x="616" y="448" width="184" height="26" rx="6" fill="#1c3430" stroke="#4b7d6c" stroke-width="1" />
  <text x="708" y="465" text-anchor="middle" class="pill-mint">Typed Browser Client</text>
</svg>
